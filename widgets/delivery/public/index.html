<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    /*
     * Sizes, colours and spacing come from Homey's widget style library so the
     * widget sits on a dashboard next to the built-in ones without looking
     * imported, and follows the dashboard into dark mode by itself. Every
     * variable has a fallback: a missing one would otherwise collapse the
     * layout rather than merely change it.
     *
     * Text keeps to the pairs of size, weight and line height the library
     * allows, so it sits on the same scale as the text of Homey's own widgets.
     * The one exception is the state's name, which is bold at the small size
     * the way Picnic's app sets its labels.
     *
     * One layout for every state, so a glance lands in the same place whatever
     * the widget is saying: whose widget this is and what state it is in at
     * the top, the one thing worth reading large at the bottom, with its
     * detail and what to do about it underneath.
     */
    body {
      margin: 0;
      overflow: hidden;
    }

    .tile {
      box-sizing: border-box;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-variant-numeric: tabular-nums;

      /* Picnic's own colours: its red, the green of its "Family" badge, the
         lighter green of its "Naar de winkel" button for an order that is in
         hand, and the yellow of its "Actie" one. Each comes as a fill and an
         ink for text and icons on the widget itself, where the fill would not
         always be readable.

         Each colour means one thing: red is Picnic, and a cart that still
         has to be ordered; the yellow's ink is a deadline within the hour;
         green is an order in hand or delivered; grey is nothing at all. */
      --brand: #e40613;
      --brand-ink: #e40613;
      --good: #295813;
      --good-ink: #295813;
      --calm: #4b7f24;
      --calm-ink: #4b7f24;
      --warn: #f6d94a;
      --warn-ink: #8a6a00;
      --muted: var(--homey-text-color-light, #8a8a8a);

      /* the one colour a state gives the widget, see STATES below, and how
         much of it goes into the tint behind the state's name */
      --tone: var(--muted);
      --tone-ink: var(--muted);
      --tint: 14%;
    }

    /* on a dark dashboard the inks are lifted until they read as text, and
       the tints deepened until they show against the dark grey */
    .homey-dark-mode .tile {
      --brand-ink: #ff4b52;
      --good-ink: #7cc45a;
      --calm-ink: #8bcf5c;
      --warn-ink: #f6d94a;
      --tint: 24%;
    }

    .tile[data-tone="brand"] { --tone: var(--brand); --tone-ink: var(--brand-ink); }
    .tile[data-tone="warn"] { --tone: var(--warn); --tone-ink: var(--warn-ink); --tint: 40%; }
    .tile[data-tone="good"] { --tone: var(--good); --tone-ink: var(--good-ink); }
    .tile[data-tone="calm"] { --tone: var(--calm); --tone-ink: var(--calm-ink); }

    .homey-dark-mode .tile[data-tone="warn"] { --tint: 45%; }

    .head {
      display: flex;
      align-items: center;
      gap: var(--homey-su-2, 8px);
      min-width: 0;
    }

    /* Whose widget this is: Picnic's app icon, its mark in white on its red,
       where Homey's own widgets put the icon of the device they are about. */
    .logo,
    .badge {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
    }

    .logo {
      background: var(--brand);
    }

    .logo svg {
      width: 18px;
      height: 18px;
      fill: var(--homey-color-white, #ffffff);
    }

    /* The state's icon on its own, for a state that has no name to put in a
       badge: the icon says what the widget is about instead. */
    .badge {
      color: var(--tone-ink);
      background: rgba(128, 128, 128, 0.14);
      background: color-mix(in srgb, var(--tone) 18%, transparent);
    }

    .icon {
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge .icon {
      width: var(--homey-icon-size-regular, 16px);
      height: var(--homey-icon-size-regular, 16px);
    }

    /* What the state is called, as a badge the way Picnic's app labels its
       offers, with the state's icon in front of the word: a tint of the
       state's colour under its ink, so the one saturated thing on the widget
       is the mark. */
    .status {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: var(--homey-su-1, 4px);
      padding: 1px var(--homey-su-2, 8px) 1px 6px;
      border-radius: var(--homey-border-radius-small, 6px);
      background: rgba(128, 128, 128, 0.14);
      background: color-mix(in srgb, var(--tone) var(--tint), transparent);
      color: var(--tone-ink);
      font-size: var(--homey-font-size-small, 14px);
      line-height: var(--homey-line-height-small, 20px);
      font-weight: var(--homey-font-weight-bold, 700);
      white-space: nowrap;
    }

    .status .icon {
      flex: none;
      width: var(--homey-icon-size-small, 14px);
      height: var(--homey-icon-size-small, 14px);
    }

    .status .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-left: auto;
      flex: none;
      font-size: var(--homey-font-size-small, 14px);
      line-height: var(--homey-line-height-small, 20px);
      color: var(--muted);
    }

    .body {
      margin-top: auto;
      min-width: 0;
    }

    /* A number is read at a glance, so it is the large thing on the widget,
       at the size the library keeps for numbers, and the words around it
       ("in", "min") are set smaller beside it. */
    /* The caption, then the number with its unit: one line where the tile is
       wide enough, the caption on a line of its own above where it is not. */
    .headline {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 0.3em;
      min-width: 0;
      color: var(--homey-text-color, inherit);
      white-space: nowrap;
      overflow: hidden;
    }

    /* the number and its unit never part */
    .figure {
      display: inline-flex;
      align-items: baseline;
      gap: 0.3em;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .value {
      font-size: var(--homey-font-size-xxlarge, 32px);
      line-height: var(--homey-line-height-xxlarge, 40px);
      font-weight: var(--homey-font-weight-bold, 700);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* a number to hurry for is set in the colour for that */
    .headline[data-value-tone="warn"] .value {
      color: var(--warn-ink);
    }

    .unit {
      flex: none;
      font-size: var(--homey-font-size-default, 17px);
      line-height: var(--homey-line-height-default, 24px);
      font-weight: var(--homey-font-weight-medium, 500);
      color: var(--muted);
    }

    /* what the number is, set like its unit: "Bezorging over 20 uur" */
    .caption {
      flex: none;
      font-size: var(--homey-font-size-default, 17px);
      line-height: var(--homey-line-height-default, 24px);
      font-weight: var(--homey-font-weight-medium, 500);
      color: var(--muted);
    }

    /* a sentence is read rather than glanced at, and may take two lines: it
       is a short phrase that has to stand out, which is what the library
       keeps its extra large text for */
    .headline[data-kind="message"] .figure {
      flex: 1 1 auto;
    }

    .headline[data-kind="message"] .value {
      font-size: var(--homey-font-size-xlarge, 24px);
      line-height: var(--homey-line-height-xlarge, 32px);
      white-space: normal;
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .detail,
    .note {
      font-size: var(--homey-font-size-small, 14px);
      line-height: var(--homey-line-height-small, 20px);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* when and at what time, next to each other where there is room for it */
    .when:not(:empty) + .what:not(:empty)::before {
      content: " · ";
    }

    .track {
      position: relative;
      margin-top: var(--homey-su-3, 12px);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    /* the empty part of the bar is drawn behind the fill rather than under
       it: an opacity on the track would take the fill inside it down with it */
    .track::before {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0.12;
    }

    .fill {
      position: relative;
      height: 100%;
      border-radius: inherit;
      background: var(--tone-ink);
      transition: width 0.4s ease-out;
    }

    .note {
      margin-top: var(--homey-su-2, 8px);
    }

    /* two lines where the tile is wide enough, each keeping to its line */
    .note .line {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note .short {
      display: none;
    }

    /* something to hurry for is in the deadline's ochre, something good in
       Picnic's green; red is kept for the cart that still has to be ordered */
    .note[data-tone="warn"] { color: var(--warn-ink); }
    .note[data-tone="good"] { color: var(--good-ink); }

    /* A half width tile on a phone has room for one thing per line, so the
       amount next to the status makes way for the status itself, and the
       icon in front of the status's name for the name. */
    @media (max-width: 239px) {
      .meta {
        display: none;
      }

      .head {
        gap: var(--homey-su-1, 4px);
      }

      .logo,
      .badge {
        width: 24px;
        height: 24px;
        border-radius: 7px;
      }

      .logo svg {
        width: 15px;
        height: 15px;
      }

      .badge .icon {
        width: var(--homey-icon-size-small, 14px);
        height: var(--homey-icon-size-small, 14px);
      }

      .status {
        padding: 1px var(--homey-su-2, 8px);
      }

      .status .icon {
        display: none;
      }

      /* and where there is not, underneath each other */
      .detail {
        white-space: normal;
      }

      .detail span {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .when:not(:empty) + .what:not(:empty)::before {
        content: none;
      }

      /* the second part is the lesser one, and keeps to a line */
      .detail .what {
        -webkit-line-clamp: 1;
      }

      /* and gives way to a note, which says in its short form what is in the
         cart: a window that takes two lines, the amount and the note would
         not fit together */
      .detail[data-note="shown"] .what {
        display: none;
      }

      .caption {
        flex-basis: 100%;
        font-size: var(--homey-font-size-small, 14px);
        line-height: var(--homey-line-height-small, 20px);
        font-weight: var(--homey-font-weight-regular, 400);
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* a day next to the number would push the number out, so it moves up
         into the caption: "Bestel vóór morgen" over "23:00" */
      .caption[data-day]::after {
        content: attr(data-day);
      }

      .unit[data-unit="day"] {
        display: none;
      }

      /* a sentence gets a third line, and a size at which a long word fits */
      .headline[data-kind="message"] .value {
        font-size: var(--homey-font-size-default, 17px);
        line-height: var(--homey-line-height-default, 24px);
        -webkit-line-clamp: 3;
      }

      /* a half width tile has room for the short form of the note only */
      .note .long {
        display: none;
      }

      .note .short {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

  <script type="text/javascript">
    // How often the app is asked again. It also says so itself the moment
    // something changes, so this is the net underneath that rather than the
    // way the widget finds out.
    var REFRESH_INTERVAL = 30 * 1000;

    // How often what is on screen is worked out again. Nothing here is ever
    // counted down in seconds, so this only has to be often enough that the
    // minute it shows is never noticeably behind the minute it is.
    var TICK_INTERVAL = 20 * 1000;

    // Below this, a deadline is close enough to hurry for and is counted down
    // in minutes rather than named as a moment.
    var URGENT_MINUTES = 60;

    // What each state looks like: its colour, its icon and what it is called
    // at the top. The words themselves come from the app, and are kept short
    // enough to sit between the mark and the amount on a full width tile,
    // and next to the mark alone on a half width one.
    var STATES = {
      // an order in hand is good news rather than something to act on, so it
      // is green; red is kept for the cart that still has to be ordered.
      // A pending order is one until the van leaves, however precise the
      // window Picnic has announced for it; Picnic's own word for it is
      // long, so it has a short form for where it does not fit.
      'ordered': { tone: 'calm', icon: 'scheduled', status: 'ordered', short: 'ordered-short' },
      'announced': { tone: 'calm', icon: 'scheduled', status: 'ordered', short: 'ordered-short' },
      'underway': { tone: 'calm', icon: 'truck', status: 'underway' },
      'arriving': { tone: 'calm', icon: 'truck', status: 'arriving' },
      'overdue': { tone: 'warn', icon: 'clock', status: 'overdue' },
      'delivered': { tone: 'good', icon: 'check', status: 'delivered' },
      'cart': { tone: 'brand', icon: 'basket', status: 'cart' },
      'empty': { tone: 'muted', icon: 'basket', status: null },
      'signed_out': { tone: 'warn', icon: 'alert', status: null },
      'stale': { tone: 'warn', icon: 'alert', status: null }
    };

    var homey = null;
    var settings = {};
    var state = null;

    // Homey's clock, minus the clock of whatever is showing the dashboard. A
    // tablet running four minutes fast would otherwise count down to a minute
    // that is not the one the app is working towards.
    var clockOffset = 0;

    function element(id) {
      return document.getElementById(id);
    }

    function onHomeyReady(Homey) {
      homey = Homey;
      settings = Homey.getSettings() || {};

      // the app announces a new state as soon as it has one, which is what
      // makes an announcement show up on the dashboard while you look at it
      Homey.on('delivery_state', adopt);

      var shown = false;
      var show = function () {
        if (shown) return;
        shown = true;
        Homey.ready();
      };

      // whatever the first call does, the widget is not left hidden over it
      setTimeout(show, 3000);
      refresh().then(show, show);

      setInterval(refresh, REFRESH_INTERVAL);
      setInterval(render, TICK_INTERVAL);
    }

    function refresh() {
      return homey.api('GET', '/state').then(adopt, function (error) {
        // the state on screen is the last one the app confirmed, which beats
        // replacing it with an error over a poll that will be tried again
        console.error(error);
      });
    }

    function adopt(data) {
      if (!data || typeof data != 'object') return;

      state = data;
      clockOffset = Date.parse(data['now']) - Date.now();
      if (isNaN(clockOffset)) clockOffset = 0;

      render();
    }

    // The widget's idea of what time it is, which is Homey's.
    function now() {
      return Date.now() + clockOffset;
    }

    function label(key) {
      return (state && state['labels'] && state['labels'][key]) || '';
    }

    // The labels arrive as sentences with __n__, __t__ and __a__ in them,
    // because the number, the moment or the amount to put in is only known
    // here: the app is not asked anything while the minutes tick away.
    function text(key, values) {
      var filled = label(key);

      for (var name in values) {
        filled = filled.replace('__' + name + '__', String(values[name]));
      }

      return filled;
    }

    function isAmount(value) {
      return typeof value == 'number' && isFinite(value);
    }

    function money(amount) {
      try {
        return new Intl.NumberFormat((state && state['locale']) || undefined, { style: 'currency', currency: 'EUR' }).format(amount);
      } catch (exception) {
        return '€ ' + amount.toFixed(2);
      }
    }

    function showPrices() {
      return settings['show_price'] !== false;
    }

    function products(count) {
      return isAmount(count) && count > 0 ? text(count == 1 ? 'item' : 'items', { n: count }) : '';
    }

    // Minutes until a moment, rounded up so nothing happens "in 0 min", or
    // null once it has passed.
    function minutesUntil(target) {
      var left = Date.parse(target) - now();
      if (isNaN(left) || left <= 0) return null;
      return Math.ceil(left / 60000);
    }

    // Whole minutes since a moment, or null while it is still ahead or has
    // been for less than a minute: there is nothing to say about that yet.
    function minutesSince(target) {
      var gone = now() - Date.parse(target);
      if (isNaN(gone) || gone < 60000) return null;
      return Math.floor(gone / 60000);
    }

    // How long is left, in the largest unit that still says something useful,
    // as the number and the words around it. Minutes are the smallest unit on
    // here: a dashboard is read in passing, and seconds ticking away would be
    // movement without information.
    function remaining(target) {
      var minutes = minutesUntil(target);
      if (minutes === null) return { value: label('now'), kind: 'message' };

      var left = Date.parse(target) - now();
      var hours = Math.round(left / 3600000);
      var days = Math.round(left / 86400000);

      var amount = minutes < 60 ? minutes : (hours < 24 ? hours : days);
      var unit = minutes < 60 ? 'minute' : (hours < 24 ? 'hour' : 'day');

      return { caption: label('delivery-in'), value: String(amount), unit: label(amount == 1 ? unit : unit + 's'), kind: 'countdown' };
    }

    // The note under a placed order, which can still be added to until its
    // deadline. It comes in two forms: two lines where the tile is wide enough,
    // one short one on a half width tile, and the page shows whichever fits.
    //
    // Something in the cart while the order is open has yet to be put on it,
    // which is a thing left undone with a deadline on it, so it is said first
    // and in the colour to hurry in. Without a cart the deadline speaks for
    // itself, in that colour only over its last hour.
    function orderNote(data) {
      var minutes = minutesUntil(data['cutOffAt']);
      if (minutes === null) return null;

      var urgent = minutes <= URGENT_MINUTES;
      var moment = data['cutOffLabel'];
      var cart = data['cart'];
      var count = cart && isAmount(cart['productCount']) ? cart['productCount'] : 0;

      if (count > 0) {
        return {
          first: text(count == 1 ? 'to-order-item' : 'to-order-items', { n: count }),
          second: urgent
            ? text(minutes == 1 ? 'to-order-in-one' : 'to-order-in', { n: minutes })
            : text('to-order-at', { t: moment }),
          short: urgent
            ? text('to-order-short-in', { c: products(count), n: minutes })
            : text('to-order-short-at', { c: products(count), t: moment }),
          tone: 'warn'
        };
      }

      return {
        first: urgent
          ? text(minutes == 1 ? 'cut-off-in-one' : 'cut-off-in', { n: minutes })
          : text('cut-off-at', { t: moment }),
        short: urgent ? text('cut-off-in-short', { n: minutes }) : text('cut-off-at', { t: moment }),
        tone: urgent ? 'warn' : null
      };
    }

    // The next day something can be delivered on: how many of its slots are
    // still open and when the first of those is, for a widget with nothing
    // planned to say what could be.
    function slotsNote(next) {
      if (!next || !next['day'] || !isAmount(next['available'])) return null;

      var values = { d: next['day'], a: next['available'], t: next['total'], h: next['time'] };

      return {
        first: text('next-slots', values),
        second: text('next-slots-first', values),
        short: text('next-slots-short', values),
        tone: null
      };
    }

    // A note that says one thing, the same on every tile.
    function note(line, tone) {
      return { first: line, short: line, tone: tone };
    }

    // What came back in deposit, once Picnic has counted it.
    function containers(deposit) {
      if (!deposit || !deposit['containers']) return '';

      return deposit['containers']
        .filter(function (container) { return container['name']; })
        .map(function (container) { return container['quantity'] + '× ' + container['name']; })
        .join(', ');
    }

    // Everything on screen, worked out before any of it is put there.
    function view(data) {
      var look = STATES[data['state']] || STATES['empty'];
      var price = showPrices() && isAmount(data['price']) && data['price'] > 0 ? money(data['price']) : '';
      // an order in hand: how much is in it, and what it costs
      var order = [products(data['orderCount']), price].filter(Boolean).join(' · ');

      var shown = {
        tone: look.tone,
        icon: look.icon,
        status: look.status ? label(look.status) : '',
        // what the name and the amount fall back to where the name does not
        // fit next to the amount: the count goes first, then the name's length
        statusShort: look.short ? label(look.short) : '',
        meta: '',
        metaShort: '',
        kind: 'message',
        // what the number is, above it
        caption: '',
        headline: '',
        unit: '',
        // the colour of the number, when it is one to hurry for
        valueTone: null,
        // a unit that is a day rather than a word like "min": a half width
        // tile has no room for it next to the number and says it above
        unitDay: '',
        // the detail line: when, and what about it
        when: '',
        what: '',
        progress: null,
        note: null
      };

      switch (data['state']) {
        case 'ordered':
        case 'announced':
        case 'underway':
          shown.meta = order;
          shown.metaShort = price;
          if (data['countdownTo']) {
            var left = remaining(data['countdownTo']);
            shown.kind = left.kind;
            shown.caption = left.caption || '';
            shown.headline = left.value;
            shown.unit = left.unit || '';
          } else {
            shown.headline = label('ordered');
          }
          shown.when = [data['day'], data['window']].filter(Boolean).join(' ');
          // what is in the cart and still has to go onto this order
          var waiting = data['cart'];
          shown.what = showPrices() && waiting && isAmount(waiting['totalPrice']) && waiting['totalPrice'] > 0 && data['cutOffAt']
            ? text('cart-amount', { a: money(waiting['totalPrice']) })
            : '';
          shown.progress = data['progress'];
          shown.note = orderNote(data);
          break;

        case 'arriving':
        case 'overdue':
          shown.meta = order;
          shown.metaShort = price;
          shown.headline = label('now');
          shown.when = [data['day'], data['window']].filter(Boolean).join(' ');
          shown.progress = data['progress'];
          // how late is the question a late delivery raises, so it is answered
          var late = data['state'] == 'overdue' ? minutesSince(data['windowEnd']) : null;
          if (late !== null) {
            shown.note = {
              first: text(late == 1 ? 'late-by-one' : 'late-by', { n: late }),
              short: text('late-short', { n: late }),
              tone: 'warn'
            };
          }
          break;

        case 'delivered':
          var deposit = data['deposit'];
          shown.meta = order;
          shown.kind = 'countdown';
          // the badge already says "delivered", so the caption says when
          shown.caption = text('delivered-caption', { d: data['day'] });
          shown.headline = data['deliveredTime'];
          shown.when = containers(deposit);
          if (deposit && isAmount(deposit['returned']) && deposit['returned'] > 0) {
            shown.note = note(text('deposit-returned', { t: money(deposit['returned']) }), 'good');
          }
          break;

        case 'cart':
          var cart = data['cart'] || {};
          // a slot someone picked, and that can still be ordered for; the one
          // Picnic suggests by itself is held for nobody, so it is not named
          var slot = cart['slotChosen'] && cart['slot'] && cart['slot']['cutOffAt'] ? cart['slot'] : null;
          var amount = showPrices() && isAmount(cart['totalPrice']) ? money(cart['totalPrice']) : '';
          // what the cart is short of the slot's minimum, which has to be
          // made up before it can be ordered at all
          var short = showPrices() && isAmount(cart['minimumShort']) && cart['minimumShort'] > 0 ? cart['minimumShort'] : null;

          shown.meta = [products(cart['productCount']), amount].filter(Boolean).join(' · ');

          if (slot) {
            // The cart is not an order until it has been through the checkout,
            // and that has to happen before the slot's deadline. Below the
            // minimum the shortfall comes first, since nothing can be ordered
            // until it is made up, and the deadline goes under it; otherwise
            // the deadline is the one thing on the widget to act on.
            var minutes = minutesUntil(slot['cutOffAt']);
            var urgent = minutes !== null && minutes <= URGENT_MINUTES;
            // today goes without saying; any other day does not
            var deadline = slot['cutOffDay'] && slot['cutOffDay'] != label('today') ? slot['cutOffLabel'] : slot['cutOffTime'];
            shown.kind = 'countdown';
            shown.when = [slot['day'], slot['window']].filter(Boolean).join(' ');

            if (short !== null) {
              shown.caption = label('minimum-caption');
              shown.headline = money(short);
              shown.what = urgent ? text('order-within-short', { n: minutes }) : text('order-before-short', { t: deadline });
            } else if (urgent) {
              shown.caption = label('order-within');
              shown.headline = String(minutes);
              shown.unit = label(minutes == 1 ? 'minute' : 'minutes');
              shown.valueTone = 'warn';
            } else {
              shown.caption = label('order-before');
              shown.headline = slot['cutOffTime'];
              shown.unit = slot['cutOffDay'] && slot['cutOffDay'] != label('today') ? slot['cutOffDay'] : '';
              shown.unitDay = shown.unit;
            }
          } else {
            // without a slot the thing to do is pick one, and what there is to
            // pick from is the next day with something open, in the short
            // form: the long one is two lines, and the note may be taken
            shown.headline = cart['slotClosed'] ? label('slot-closed') : label('pick-slot');
            var open = slotsNote(data['nextSlots']);
            if (open) shown.when = open.short;
            if (short !== null) shown.note = note(text('minimum', { t: money(short) }), 'warn');
          }
          break;

        case 'signed_out':
          shown.headline = label('signed-out');
          shown.when = label('signed-out-detail');
          break;

        case 'stale':
          // what the app last heard is not repeated, only when it heard it
          shown.headline = label('stale');
          shown.when = data['checkedLabel'] ? text('stale-since', { t: data['checkedLabel'] }) : '';
          break;

        default:
          shown.headline = label('empty');
          shown.when = data['cartKnown'] ? label('empty-cart') : '';
          // nothing planned, but this is when something could be
          shown.note = slotsNote(data['nextSlots']);
      }

      return shown;
    }

    function render() {
      if (state === null) return;

      var shown = view(state);

      element('tile').dataset.tone = shown.tone;

      // the icon sits in the badge when the state has no name, and in front
      // of the name when it has one
      var named = shown.status != '';
      element('badge').hidden = named;
      element('badge').dataset.icon = shown.icon;
      element('badge-icon').setAttribute('href', '#i-' + shown.icon);
      element('status-pill').hidden = !named;
      element('status-pill').dataset.icon = shown.icon;
      element('status-icon').setAttribute('href', '#i-' + shown.icon);
      element('status').textContent = shown.status;
      element('meta').textContent = shown.meta;

      element('caption').textContent = shown.caption;
      element('caption').hidden = shown.caption == '';
      if (shown.unitDay) {
        element('caption').dataset.day = ' ' + shown.unitDay;
      } else {
        delete element('caption').dataset.day;
      }
      element('value').textContent = shown.headline;
      element('unit').textContent = shown.unit;
      element('unit').hidden = shown.unit == '';
      element('unit').dataset.unit = shown.unitDay ? 'day' : '';
      element('headline').dataset.kind = shown.kind;
      element('headline').dataset.valueTone = shown.valueTone || '';

      element('when').textContent = shown.when;
      element('what').textContent = shown.what;
      element('detail').hidden = shown.when == '' && shown.what == '';

      var progress = shown.progress;
      var known = typeof progress == 'number' && isFinite(progress);
      element('track').hidden = !known;
      element('fill').style.width = known ? Math.round(progress * 100) + '%' : '0%';

      var said = shown.note;
      element('note-first').textContent = said ? said.first : '';
      element('note-second').textContent = said && said.second ? said.second : '';
      element('note-second').hidden = !(said && said.second);
      element('note-short').textContent = said ? (said.short || said.first) : '';
      element('note').dataset.tone = said && said.tone ? said.tone : '';
      element('note').hidden = !said;
      element('detail').dataset.note = said ? 'shown' : '';

      fit(shown);
    }

    // The name of the state and the amount share the top line with the mark,
    // and not every name fits next to every amount. Measured rather than
    // guessed, since the width of a tile and the width of a word are both
    // only known here: a name that comes out cut off gives up the product
    // count next to it first, and its own length after that.
    function fit(shown) {
      var name = element('status');
      if (!(name.clientWidth > 0)) return;
      if (name.scrollWidth <= name.clientWidth) return;

      if (shown.metaShort && shown.metaShort != shown.meta) {
        element('meta').textContent = shown.metaShort;
        if (name.scrollWidth <= name.clientWidth) return;
      }

      if (shown.statusShort && shown.statusShort != shown.status) name.textContent = shown.statusShort;
    }
  </script>
</body>

</html>
